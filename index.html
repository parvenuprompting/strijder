<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>Strijder — CBR Theorie-oefening</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0a0e1a; --card: #131a2e; --ink: #e8ecf4; --muted: #8b94ab;
    --accent: #4f8cff; --goed: #3ecf8e; --fout: #ff5c72; --goud: #ffc857;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, sans-serif; min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 80px; }

  /* === hoofdscherm === */
  .hero { text-align: center; padding: 30px 0 24px; }
  .hero .logo { font-size: 56px; }
  .hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin-top: 8px; }
  .hero .sub { color: var(--muted); margin-top: 6px; font-size: 15px; }

  .meter-card { background: var(--card); border-radius: 20px; padding: 22px; margin-top: 18px; }
  .meter-card h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .meter-bar { background: #0d1322; border-radius: 999px; height: 14px; margin: 14px 0 10px; overflow: hidden; }
  .meter-vul { height: 100%; border-radius: 999px; transition: width .6s ease; }
  .meter-tekst { display: flex; justify-content: space-between; font-size: 13px; }
  .meter-tekst .groot { font-size: 20px; font-weight: 700; }

  .modi { display: grid; gap: 12px; margin-top: 18px; }
  .modus-knop {
    display: flex; align-items: center; gap: 16px; background: var(--card);
    border: 1px solid #1e2742; border-radius: 18px; padding: 18px; cursor: pointer;
    transition: transform .1s; text-align: left; width: 100%; color: var(--ink);
  }
  .modus-knop:active { transform: scale(.98); }
  .modus-icoon { font-size: 32px; }
  .modus-titel { font-weight: 700; font-size: 17px; }
  .modus-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

  /* === vraag-scherm === */
  .vraag-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .vraag-tag { background: #1e2742; color: var(--accent); padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .vraag-vooruitgang { color: var(--muted); font-size: 13px; }
  .vraag-tekst { font-size: 19px; line-height: 1.45; font-weight: 600; margin-bottom: 22px; }
  .optie {
    display: flex; align-items: center; gap: 12px; background: var(--card);
    border: 2px solid #1e2742; border-radius: 14px; padding: 16px; margin-bottom: 10px;
    cursor: pointer; transition: all .15s; width: 100%; color: var(--ink); font-size: 15px; text-align: left;
  }
  .optie .letter { background: #1e2742; color: var(--accent); font-weight: 800; border-radius: 10px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .optie.juist { border-color: var(--goed); background: rgba(62,207,142,.08); }
  .optie.juist .letter { background: var(--goed); color: #06281a; }
  .optie.verkeerd { border-color: var(--fout); background: rgba(255,92,114,.08); }
  .optie.verkeerd .letter { background: var(--fout); color: #2b0a10; }
  .uitleg-box { background: var(--card); border-left: 3px solid var(--accent); border-radius: 12px; padding: 14px; font-size: 14px; line-height: 1.5; color: var(--muted); margin: 14px 0; }
  .uitleg-box strong { color: var(--ink); }
  .knop-volgende { width: 100%; background: var(--accent); color: white; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 6px; }

  /* === resultaat === */
  .resultaat-hero { text-align: center; padding: 40px 0; }
  .resultaat-score { font-size: 64px; font-weight: 800; }
  .resultaat-score.goed { color: var(--goed); }
  .resultaat-score.mwa { color: var(--goud); }
  .resultaat-score.slecht { color: var(--fout); }
  .resultaat-sub { color: var(--muted); margin-top: 8px; font-size: 15px; }
  .coach-box { background: var(--card); border-radius: 16px; padding: 18px; margin: 20px 0; border-left: 3px solid var(--goud); }
  .coach-box .rol { font-size: 12px; color: var(--goud); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 8px; }
  .coach-box .tekst { font-size: 15px; line-height: 1.55; }
  .stats-lijst { margin-top: 16px; }
  .stat-rij { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1e2742; font-size: 14px; }
  .stat-rij:last-child { border-bottom: none; }
  .stat-waarde { font-weight: 700; }

  .terug { color: var(--muted); background: none; border: none; font-size: 14px; cursor: pointer; padding: 10px 0; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f6fa; --card: #ffffff; --ink: #101527; --muted: #5b6478; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="app.js"></script>
</body>
</html>
